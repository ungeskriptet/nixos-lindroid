name: CI

on:
  workflow_dispatch:

jobs:
  check:
    name: Build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: nixos-lindroid
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build -L .#nixosConfigurations.lindroid.config.system.build.toplevel
