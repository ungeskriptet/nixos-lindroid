name: CI

on:
  workflow_dispatch:

jobs:
  check:
    name: Check flake
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Build Kwin
        run: nix build -L .#nixosConfigurations.lindroid.pkgs.kdePackages.kwin
